<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your order | Gelamé Candle</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--cream:#f7f1e3;--moss:#bcd160;--moss-d:#4f6417;--amber:#2e1b0f;--blush:#f1d3e2;--ink:#3a2a1e;--serif:"Cormorant Garamond",Georgia,serif;--sans:"Jost",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font:17px/1.65 var(--sans)}
nav{padding:14px 5vw;border-bottom:1px solid #e3d8bf}
nav a{font:600 24px var(--serif);text-decoration:none;color:inherit}
main{max-width:640px;margin:0 auto;padding:9vh 5vw;text-align:center}
.badge{width:84px;height:84px;margin:0 auto 20px;border-radius:50%;background:var(--blush);border:3px solid var(--moss);display:grid;place-items:center;font-size:38px}
h1{font:600 clamp(2.4rem,7vw,3.6rem)/1.05 var(--serif);margin:0 0 .4em}
p{margin:.6em auto;max-width:48ch}
.order{display:inline-block;margin:10px 0;padding:6px 16px;border-radius:999px;background:#fbf7ec;border:1px solid #e3d8bf;font-weight:500;letter-spacing:.06em}
.btn{display:inline-block;margin:8px 6px;padding:14px 28px;border-radius:999px;font-weight:500;text-decoration:none;background:var(--moss);color:var(--amber);border:0;font:500 17px var(--sans);cursor:pointer}
.btn.alt{background:transparent;border:2px solid var(--moss-d);color:var(--ink)}
.hide{display:none}
:focus-visible{outline:3px solid var(--moss-d);outline-offset:3px}
</style>
</head>
<body>
<nav><a href="/">Gelamé</a></nav>
<main>
  <div class="badge" id="badge" aria-hidden="true">…</div>
  <h1 id="title">Checking your payment…</h1>
  <p id="msg">One moment while we confirm with the bank.</p>
  <div id="orderbox" class="hide"><span class="order" id="orderno"></span></div>
  <div id="actions"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
let saved = null;
try { saved = JSON.parse(localStorage.getItem('gelame_order') || 'null'); } catch (e) {}
const params = new URLSearchParams(location.search);
const order = (params.get('order_number') || (saved && saved.order) || '').toUpperCase();

function waLink() {
  const o = saved || {};
  const lines = ['Hi Gelamé, I have paid for my order.', '', 'Order number: ' + order];
  if (o.qty) lines.push(o.qty + ' x Gelamé Scented Candle (100ml)', 'Total paid: RM ' + o.total);
  if (o.name) lines.push('', 'Name: ' + o.name, 'Phone: ' + o.phone, '', 'Delivery address:', o.address, o.postcode + ' ' + o.city, o.state + ', Malaysia');
  if (o.notes) lines.push('', 'Notes: ' + o.notes);
  return 'https://wa.me/60196403860?text=' + encodeURIComponent(lines.join('\n'));
}
function show(badge, title, msg, actions) {
  $('badge').textContent = badge; $('title').textContent = title; $('msg').textContent = msg; $('actions').innerHTML = actions;
}
const shopBtn = '<a class="btn alt" href="/">Back to shop</a>';

async function check(tries) {
  try {
    const r = await fetch(saved.api + '/status?order=' + encodeURIComponent(order));
    const out = await r.json();
    if (out.state === 'paid') {
      show('✓', 'Payment received', 'Thank you! Please send your delivery details to us on WhatsApp so we can pack your order.',
        '<a class="btn" href="' + waLink() + '" target="_blank" rel="noopener" id="wa">Send my order on WhatsApp</a>' + shopBtn);
      $('wa').addEventListener('click', () => { try { localStorage.removeItem('gelame_order'); } catch (e) {} });
      return;
    }
    if (out.state === 'failed') {
      show('!', 'Payment not completed', 'No money was taken for this order. You can try again from the shop.', shopBtn);
      return;
    }
  } catch (e) {}
  if (tries > 0) { setTimeout(() => check(tries - 1), 4000); return; }
  show('…', 'Still waiting for the bank', 'Please do not pay again. Message us your order number and we will confirm it for you.',
    '<a class="btn" href="' + waLink() + '" target="_blank" rel="noopener">Message us on WhatsApp</a>' + shopBtn);
}

if (!order) {
  show('?', 'No order found', 'We could not find an order on this device. If you just paid, WhatsApp us your payment receipt.',
    '<a class="btn" href="https://wa.me/60196403860" target="_blank" rel="noopener">WhatsApp us</a>' + shopBtn);
} else {
  $('orderno').textContent = 'Order ' + order; $('orderbox').classList.remove('hide');
  if (saved && saved.api) check(12);
  else show('✓', 'Thank you', 'If your payment went through, WhatsApp us your order number and we will confirm it.',
    '<a class="btn" href="' + waLink() + '" target="_blank" rel="noopener">Message us on WhatsApp</a>' + shopBtn);
}
</script>
</body>
</html>
